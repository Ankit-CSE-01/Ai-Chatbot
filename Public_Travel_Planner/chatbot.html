<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Road Trip Assistant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --primary: #27ae60;
        --secondary: #2ecc71;
        --accent: #e67e22;
        --light: #ecf0f1;
        --dark: #121e15;
        --darker: #0a110c;
        --road: #95a5a6;
        --nature: #27ae60;
        --food: #d35400;
        --stay: #8e44ad;
        --highlight: #2ecc71;
        --card-bg: #1a251d;
      }
      body {
        background-color: var(--darker);
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-image: linear-gradient(rgba(10, 17, 12, 0.9), rgba(10, 17, 12, 0.9)), 
                          url('https://images.unsplash.com/photo-1469827160215-9d29e96e72f4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
        background-size: cover;
        background-attachment: fixed;
      }
      
      .card-main {
        background: var(--card-bg);
        border-radius: 8px;
        border: 1px solid #2d3b32;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        background-image: linear-gradient(rgba(26, 37, 29, 0.9), rgba(26, 37, 29, 0.9));
      }
      
      .header {
        color: var(--primary);
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      
      .user-message {
        background: var(--primary);
        color: white;
        border-radius: 18px 18px 4px 18px;
        max-width: 75%;
      }
      
      .ai-message {
        background: #223026;
        color: #e0e0e0;
        border-radius: 18px 18px 18px 4px;
        max-width: 75%;
        border: 1px solid #2d3b32;
      }
      
      .message-container {
        background-color: transparent;
        border-radius: 8px;
        min-height: 60vh;
        max-height: 62vh;
      }
      
      .input-box {
        background: #223026;
        border: 1px solid #2d3b32;
        color: white;
      }
      
      .input-box:focus {
        background: #2a3b30;
        color: white;
        border-color: var(--primary);
        box-shadow: 0 0 0 0.25rem rgba(39, 174, 96, 0.25);
      }
      
      .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        transition: all 0.2s ease;
      }
      
      .send-btn:hover {
        background: var(--secondary);
      }
      
      .tag {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        margin-right: 8px;
        margin-bottom: 8px;
        background: #2a3b30;
        color: #e0e0e0;
      }
      
      .road-tag { border-left: 3px solid var(--road); }
      .nature-tag { border-left: 3px solid var(--nature); }
      .food-tag { border-left: 3px solid var(--food); }
      .stay-tag { border-left: 3px solid var(--stay); }
      
      .highlight {
        font-weight: 600;
        color: var(--highlight);
      }
      
      .trip-points li {
        position: relative;
        padding-left: 1.5rem;
        margin-bottom: 0.75rem;
      }
      
      .trip-points li:before {
        content: "•";
        color: var(--primary);
        font-size: 1.5rem;
        position: absolute;
        left: 0;
        top: -0.25rem;
      }
      
      .typing-indicator {
        display: flex;
        padding: 8px 16px;
      }
      .typing-dot {
        width: 8px;
        height: 8px;
        margin: 0 2px;
        background-color: var(--primary);
        border-radius: 50%;
        opacity: 0.4;
        animation: typing 1.4s infinite ease-in-out;
      }
      
      .typing-dot:nth-child(1) { animation-delay: 0s; }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-3px); opacity: 1; }
      }
      
      .suggestion-card {
        background: #223026;
        border: 1px solid #2d3b32;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .suggestion-card:hover {
        border-color: var(--primary);
        background: #2a3b30;
      }
      
      .message-author {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--primary);
      }
      
      .text-muted {
        color: #aaa !important;
      }
      
      /* New nature-themed elements */
      .leaf-decoration {
        color: var(--primary);
        opacity: 0.7;
      }
      
      .card-footer {
        background: rgba(34, 48, 38, 0.7) !important;
        backdrop-filter: blur(5px);
      }
    </style>
</head>
<body>
    <div class="container py-4">
      <div class="header h1 text-center my-4 fw-bold">
        <i class="fas fa-route me-2"></i>Public Transport Planner
      </div>
      
      <div class="row mb-4">
        <div class="col-12">
        </div>
      </div>
      
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <div class="card card-main">
            <div class="card-body p-0">
              <div class="p-4">
                <div class="message-container p-4 overflow-auto">
                  <div class="user-message p-3 ms-auto mb-3">
                    <small class="message-author d-block mb-1"><i class="fas fa-user me-1"></i>You</small>
                    <p class="mb-0">Hi</p>
                  </div>
                  <div class="ai-message p-3 mb-3">
                    <small class="message-author d-block mb-1"><i class="fas fa-robot me-1"></i>Travel Assistant</small>
                    <p class="mb-2"><span class="highlight">Hello! I'm your AI Road Trip Planner.</span></p>
                    <p class="mt-2 mb-0"><span class="highlight">Where would you like to travel?</span></p>
                  </div>
                </div>
              </div>
              
              <div class="card-footer border-top-0 bg-transparent">
                <div class="row g-2">
                  <div class="col-10">
                    <input type="text" id="inputPrompt" class="form-control input-box" placeholder="Where would you like to go?" />
                  </div>
                  <div class="col-2">
                    <button class="btn send-btn w-100 h-100" id="sendPromptBtn" onclick="GetResponse()">
                      <i class="fas fa-paper-plane"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function formatResponse(response) {
        // Convert markdown formatting to HTML
        response = response.replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>');
        response = response.replace(/\n\s*-\s*(.*?)(?=\n|$)/g, '<li>$1</li>');
        response = response.replace(/(<li>.*<\/li>)+/g, '<ul class="trip-points ps-0 mb-2">$&</ul>');
        response = response.replace(/\n\n/g, '</p><p>');
        return response;
      }

      function useSuggestion(text) {
        document.getElementById('inputPrompt').value = text;
        GetResponse();
      }

      function showTypingIndicator() {
        const messageContainer = document.querySelector('.message-container');
        
        const typingDiv = document.createElement('div');
        typingDiv.className = 'ai-message p-3 mb-3';
        typingDiv.innerHTML = `
          <small class="message-author d-block mb-1"><i class="fas fa-robot me-1"></i>Road Trip Assistant</small>
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        `;
        
        messageContainer.appendChild(typingDiv);
        messageContainer.scrollTop = messageContainer.scrollHeight;
        return typingDiv;
      }

      function GetResponse() {
        const sendPromptBtn = document.getElementById("sendPromptBtn");
        const inputPrompt = document.getElementById("inputPrompt");
        const messageContainer = document.querySelector('.message-container');
        const promptValue = inputPrompt.value;

        if (!promptValue.trim()) return;

        // Disable button during request
        sendPromptBtn.disabled = true;
        sendPromptBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

        // Add user message
        messageContainer.innerHTML += `
          <div class="user-message p-3 ms-auto mb-3">
            <small class="message-author d-block mb-1"><i class="fas fa-user me-1"></i>You</small>
            <p class="mb-0">${promptValue}</p>
          </div>
        `;
        
        // Show typing indicator
        const typingIndicator = showTypingIndicator();
        
        // Hide suggestion cards after first query
        const suggestionRow = document.querySelector('.suggestion-row');
        if (suggestionRow) suggestionRow.style.display = 'none';

        const roleValue = `You are a professional road trip planning assistant. Always respond with:
1. Well-organized information with clear headings
2. Highlight key details using **double asterisks**
3. Include practical information:
   - Driving distances and estimated times
   - Recommended stops with suggested durations
   - Cost estimates where applicable
   - Seasonal considerations
4. Use bullet points for lists
5. Provide safety tips when relevant
6. Offer alternative options when available
7. Keep responses detailed but concise
8. Maintain a professional yet helpful tone`;

        fetch(
          "http://localhost/Virtual%20Assiatance/api.php?role=" +
            encodeURIComponent(roleValue) +
            "&&prompt=" +
            encodeURIComponent(promptValue)
        )
          .then((res) => {
            if (!res.ok) throw new Error("API response error");
            return res.json();
          })
          .then((data) => {
            // Remove typing indicator
            messageContainer.removeChild(typingIndicator);
            
            if (data.choices && data.choices[0] && data.choices[0].message) {
              const assistantResponse = formatResponse(data.choices[0].message.content);

              messageContainer.innerHTML += `
                <div class="ai-message p-3 mb-3">
                  <small class="message-author d-block mb-1"><i class="fas fa-robot me-1"></i>Road Trip Assistant</small>
                  <div>${assistantResponse}</div>
                </div>
              `;
            } else {
              messageContainer.innerHTML += `
                <div class="ai-message p-3 mb-3">
                  <small class="message-author d-block mb-1"><i class="fas fa-robot me-1"></i>Road Trip Assistant</small>
                  <p>I couldn't process that request. Please try rephrasing your question.</p>
                </div>
              `;
            }

            inputPrompt.value = "";
            sendPromptBtn.disabled = false;
            sendPromptBtn.innerHTML = `<i class="fas fa-paper-plane"></i>`;
            messageContainer.scrollTop = messageContainer.scrollHeight;
          })
          .catch((error) => {
            console.error("Error:", error);
            messageContainer.removeChild(typingIndicator);
            messageContainer.innerHTML += `
              <div class="ai-message p-3 mb-3">
                <small class="message-author d-block mb-1"><i class="fas fa-robot me-1"></i>Road Trip Assistant</small>
                <p>I'm experiencing technical difficulties. Please try again shortly.</p>
              </div>
            `;
            sendPromptBtn.disabled = false;
            sendPromptBtn.innerHTML = `<i class="fas fa-paper-plane"></i>`;
            messageContainer.scrollTop = messageContainer.scrollHeight;
          });
      }
      
      document.getElementById('inputPrompt').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') GetResponse();
      });
    </script>
</body>
</html>
